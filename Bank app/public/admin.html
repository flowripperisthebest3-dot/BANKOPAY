<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>INRI ADMIN CONNECTED</title>
<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui;background:#0a0a0a;color:white;min-height:100vh}.header{background:#111;padding:15px;display:flex;justify-content:space-between;border-bottom:1px solid #222}.container{max-width:1200px;margin:0 auto;padding:20px}.card{background:#161616;border:1px solid #252525;padding:20px;border-radius:16px;margin-bottom:20px}input,button,textarea{padding:14px;width:100%;margin:8px 0;border-radius:10px;border:1px solid #333;background:#0f0f0f;color:white}button{background:#00ff88;color:black;font-weight:800;cursor:pointer;border:none}.tab{display:flex;gap:10px;margin-bottom:20px}.tab button{flex:1;background:#1e1e1e;color:white}.tab button.active{background:white!important;color:black!important}.user{background:#1a1a1a;padding:15px;border-radius:12px;margin:10px 0;border-left:4px solid #00ff88}.bal{font-size:28px;font-weight:900;color:#00ff88}.uploadBox{border:2px dashed #333;padding:20px;text-align:center;border-radius:12px;background:#0f0f0f}#loginBox{max-width:400px;margin:80px auto}</style></head><body>
<div id="loginBox" class="card"><h2>INRI ADMIN - ENV ONLY</h2><input id="adminPass" type="password" placeholder="ENV Password"><button onclick="login()">LOGIN</button><p id="st" style="color:#00ff88"></p></div>
<div id="mainBox" style="display:none"><div class="header"><h2>INRI DASHBOARD - CONNECTED</h2><small>ENV Protected</small></div><div class="container">
<div class="tab"><button id="b1" class="active" onclick="showTab('bank')">BANK USERS</button><button id="b2" onclick="showTab('files')">PROJECTS</button></div>

<div id="bankTab"><div class="card"><h3>Add Money</h3><input id="bPhone" placeholder="Phone"><input id="bAmount" type="number" placeholder="Amount"><button onclick="addMoney()">CREDIT</button></div><div class="card"><button onclick="loadUsers()">REFRESH USERS</button><div id="usersList"></div></div></div>

<div id="filesTab" style="display:none">
<div class="card"><h3>Upload Project - Connects to Bank App</h3>
<div class="uploadBox"><input type="file" id="fileInput"><button onclick="uploadRealFile()" style="margin-top:10px">1. UPLOAD FILE TO /uploads/</button><p id="uploadStatus" style="color:#00ff88;margin-top:10px"></p><input id="uploadedLink" readonly placeholder="Link appears here"></div><hr style="margin:20px 0;border-color:#222">
<input id="fTitle" placeholder="Project Title"><textarea id="fDesc" placeholder="Description" rows="2"></textarea><input id="fPrice" type="number" placeholder="Price e.g 1500"><input id="fLink" placeholder="Download Link - auto filled"><button onclick="addFile()">2. SAVE - Will load in Bank App /api/bank/projects</button>
</div>
<div class="card"><button onclick="loadFiles()">REFRESH PROJECTS</button><div id="filesList"></div></div>
</div>
</div></div>
<script>
let ADMIN="";
async function login(){ADMIN=document.getElementById('adminPass').value.trim();let r=await fetch('/api/admin/check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({adminPassword:ADMIN})});let d=await r.json();if(d.success){document.getElementById('loginBox').style.display='none';document.getElementById('mainBox').style.display='block';loadUsers();loadFiles();}else alert("Wrong ENV");}
function showTab(t){document.getElementById('bankTab').style.display=t==='bank'?'block':'none';document.getElementById('filesTab').style.display=t==='files'?'block':'none';document.getElementById('b1').className=t==='bank'?'active':'';document.getElementById('b2').className=t==='files'?'active':''}
async function uploadRealFile(){
 let file=document.getElementById('fileInput').files[0]; if(!file) return alert("Select file");
 document.getElementById('uploadStatus').innerText="Uploading...";
 let fd=new FormData(); fd.append('projectFile',file);
 let r=await fetch(`/api/admin/upload-file?adminPassword=${encodeURIComponent(ADMIN)}`,{method:'POST',body:fd});
 let d=await r.json();
 if(d.success){document.getElementById('uploadStatus').innerText="✅ Saved: "+d.fileUrl; document.getElementById('uploadedLink').value=d.fileUrl; document.getElementById('fLink').value=d.fileUrl;}
 else document.getElementById('uploadStatus').innerText="Failed";
}
async function loadUsers(){let r=await fetch(`/api/admin/bank/users?adminPassword=${encodeURIComponent(ADMIN)}`);let data=await r.json();let h="";for(let p in data){let u=data[p];h+=`<div class="user"><b>${u.name}</b> | ${p}<br>Acc: ${u.accountNumber}<br><div class="bal">₦${Number(u.balance).toLocaleString()}</div></div>`}document.getElementById('usersList').innerHTML=h||"No users"}
async function addMoney(){await fetch(`/api/admin/bank/addmoney?adminPassword=${encodeURIComponent(ADMIN)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({adminPassword:ADMIN,phone:document.getElementById('bPhone').value,amount:document.getElementById('bAmount').value})});alert("Credited");loadUsers()}
async function loadFiles(){let r=await fetch(`/api/admin/files?adminPassword=${encodeURIComponent(ADMIN)}`);let d=await r.json();let h="";(d.files||[]).forEach(f=>{h+=`<div class="user"><b>${f.title}</b> - ₦${f.price}<br>${f.desc}<br><a href="${f.downloadLink}" target="_blank" style="color:#00ff88;word-break:break-all">${f.downloadLink}</a><br><small>Bank App loads from /api/bank/projects | Files App gives login after buy</small><br><button onclick="delFile(${f.id})" style="background:red;color:white;width:auto;padding:5px 15px;margin-top:5px">DELETE</button></div>`});document.getElementById('filesList').innerHTML=h||"No projects"}
async function addFile(){let r=await fetch(`/api/admin/files?adminPassword=${encodeURIComponent(ADMIN)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({adminPassword:ADMIN,title:document.getElementById('fTitle').value,desc:document.getElementById('fDesc').value,price:document.getElementById('fPrice').value,downloadLink:document.getElementById('fLink').value})});let d=await r.json();if(d.success){alert("Saved! Now Bank App will load it from /api/bank/projects");loadFiles();}}
async function delFile(id){await fetch(`/api/admin/files/delete?adminPassword=${encodeURIComponent(ADMIN)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({adminPassword:ADMIN,id})});loadFiles();}
</script></body></html>
